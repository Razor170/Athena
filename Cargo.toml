[package]
name = "athena"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A lightweight, portable Windows desktop companion for EVE Online"
publish = false

# The app plus the `xtask` build helper (see .cargo/config.toml).
[workspace]
members = [".", "xtask"]

[features]
# Build with the wgpu renderer instead of glow (OpenGL). Only used to compare
# the two backends: `cargo build --release --features wgpu`.
wgpu = ["eframe/wgpu"]

[dependencies]
# UI framework. Default features are turned off so we only pull in what we use:
# the glow (OpenGL) renderer, the built-in fonts, and the Linux window backends
# (x11/wayland do nothing on Windows but let the app build in a Linux sandbox).
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
# Dockable tabs: drag panels around, split, resize. `serde` lets us save the layout.
egui_dock = { version = "0.21", features = ["serde"] }
# Finds the Documents and %APPDATA% folders the Windows way (handles redirected folders).
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
# HTTP for ESI. `blocking` runs requests from a plain background thread, so the
# app needs no async code of its own. TLS is rustls (no OpenSSL DLLs), and it
# trusts the Windows certificate store. `gzip` makes ESI responses smaller.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
    "json",
    "gzip",
    "form",
] }
# SQLite, compiled into the exe (`bundled`), so there is no DLL to ship.
# Reads static.sqlite (game data) and, later, the mining history.
rusqlite = { version = "0.41", features = ["bundled"] }
# Auto-updater: stores the GitHub token in Windows Credential Manager
# (`windows-native`; on Linux test builds it falls back to an in-memory
# store). Version 3, the last with this simple one-crate API.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# EVE login (PKCE): random numbers and SHA-256. Already built as part of
# rustls (reqwest's TLS), so using it directly adds no new code to the exe.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
# EVE login: base64url for PKCE and for reading the access token. Already
# pulled in by reqwest.
base64 = "0.23"
# EVE login: reading the access token's JSON. Already pulled in by reqwest.
serde_json = "1"
# Auto-updater: unpacks the downloaded release zip. Only `deflate` (the
# format GitHub's and `zip -r`'s zips use), no other compression or crypto.
zip = { version = "9", default-features = false, features = ["deflate"] }

# Windows-only: reading the clipboard (for belt scans), the alert beep, the
# Intel voice alerts (PlaySoundW, from Win32_Media_Audio) and the overlay
# windows (window calls, GDI for their pictures and text, the overlay
# thread's id from Win32_System_Threading, the mouse capture while the
# overlay is dragged from Win32_UI_Input_KeyboardAndMouse, and DPI
# awareness before the saved window placement is checked from
# Win32_UI_HiDpi). These are
# thin, official bindings to the Windows API, with no other dependencies.
[target.'cfg(windows)'.dependencies]
# Gets the main window's handle from eframe, to remember its position and
# size (src/window_place.rs). Already part of the build through eframe and
# winit, so it adds no new code.
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Smaller, faster exe at the cost of a slower release build.
lto = "thin"
codegen-units = 1
strip = true
