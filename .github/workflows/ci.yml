# Checks every push and pull request, and builds the portable Windows zip.
# Every push to main is tagged and published as a pre-release such as
# v0.1.1-alpha.6 (see "Work out the version" below). Pushing a version tag
# such as v0.2.0 by hand publishes a normal release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check and build (Windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and all tags, so the version step can count
          # commits since the last release tag.
          fetch-depth: 0

      # MinVer-style version from git:
      # - on a release tag (v0.1.0) the version is the tag itself;
      # - otherwise it is the last release tag with the patch number raised
      #   by one, plus "-alpha.<height>", where height counts the commits on
      #   main's first-parent line since that tag (each merged PR adds one).
      #   So v0.1.0 + 6 merges = 0.1.1-alpha.6.
      # Pre-release tags (anything with a "-") are never used as the base.
      # PR builds add "+pr.<number>" so their zip can't be mistaken for a
      # main build. The exe reads the result from ATHENA_VERSION at compile time.
      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $base = git describe --tags --abbrev=0 --match "v[0-9]*" --exclude "*-*" HEAD 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $base) {
            Write-Error "No release tag (v<major>.<minor>.<patch>) found in the history."
            exit 1
          }
          if ($base -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            Write-Error "Release tag $base isn't v<major>.<minor>.<patch>."
            exit 1
          }
          $major = [int]$Matches[1]; $minor = [int]$Matches[2]; $patch = [int]$Matches[3]
          $height = [int](git rev-list --count --first-parent "$base..HEAD")
          if ($height -eq 0) {
            $version = "$major.$minor.$patch"
          } else {
            $version = "$major.$minor.$($patch + 1)-alpha.$height"
          }
          if ("${{ github.event_name }}" -eq "pull_request") {
            $version = "$version+pr.${{ github.event.number }}"
          } elseif ("${{ github.ref_type }}" -ne "tag" -and "${{ github.ref }}" -ne "refs/heads/main") {
            # A manual run on another branch: mark it like a PR build.
            $version = "$version+${{ github.ref_name }}" -replace '[^0-9A-Za-z.+-]', '-'
          }
          Write-Output "Version: $version (base $base, height $height)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "ATHENA_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Clippy (wgpu renderer)
        run: cargo clippy --locked --all-targets --features wgpu -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Release build
        run: cargo build --release --locked

      # Static game data (ore volumes, reprocessing, the map): built from the official
      # SDE by `cargo xtask sde` and shipped next to the exe. The ~100 MB SDE
      # zip is cached per SDE build, so it is only downloaded after a patch.
      # If CCP's site is down, the newest cached SDE is used instead.
      - name: Find latest SDE build
        id: sde
        shell: pwsh
        run: |
          # Saved to a file first: the site sends JSON Lines, which
          # Invoke-WebRequest hands back as bytes rather than text.
          $build = ""
          try {
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 60 -OutFile sde-latest.jsonl https://developers.eveonline.com/static-data/tranquility/latest.jsonl
            $build = "$((Get-Content -Raw sde-latest.jsonl | ConvertFrom-Json).buildNumber)"
          } catch {
            Write-Warning "Can't reach the SDE site: $_"
          }
          if ($build -notmatch '^\d+$') {
            Write-Warning "No SDE build number found, using the newest cached SDE."
            $build = "unavailable"
          }
          Write-Output "SDE build: $build"
          "build=$build" >> $env:GITHUB_OUTPUT

      - name: Cache SDE
        id: sde-cache
        uses: actions/cache@v4
        with:
          path: sde.zip
          key: sde-${{ steps.sde.outputs.build }}
          # No exact match: start from the newest SDE we have.
          restore-keys: sde-

      - name: Download SDE
        if: steps.sde-cache.outputs.cache-hit != 'true' && steps.sde.outputs.build != 'unavailable'
        shell: pwsh
        run: |
          $url = "https://developers.eveonline.com/static-data/tranquility/eve-online-static-data-${{ steps.sde.outputs.build }}-jsonl.zip"
          for ($try = 1; $try -le 3; $try++) {
            try {
              Invoke-WebRequest -UseBasicParsing -TimeoutSec 600 -OutFile sde.new.zip $url
              Move-Item -Force sde.new.zip sde.zip
              exit 0
            } catch {
              Write-Warning "SDE download attempt $try failed: $_"
              Start-Sleep -Seconds (15 * $try)
            }
          }
          if (Test-Path sde.zip) {
            Write-Warning "Using the older cached SDE instead."
          } else {
            Write-Error "No SDE available."
            exit 1
          }

      # Intel Supervisor voice alerts ("Enemy 3 jumps"), spoken by the
      # Windows built-in voice into 16-bit mono WAVs. Windows PowerShell 5.1
      # (`shell: powershell`) has System.Speech; PowerShell 7 doesn't.
      # The names must match `file_name` in src/modules/intel/sound.rs.
      - name: Make voice alert sounds
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Speech
          $dir = "dist/Athena/sounds"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          if ($voice.GetInstalledVoices().Count -eq 0) {
            Write-Error "No Windows voice is installed on this runner."
            exit 1
          }
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(22050, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          for ($jumps = 0; $jumps -le 10; $jumps++) {
            if ($jumps -eq 0) { $name = "enemy-in-system.wav"; $text = "Enemy in system" }
            elseif ($jumps -eq 1) { $name = "enemy-1-jump.wav"; $text = "Enemy 1 jump" }
            else { $name = "enemy-$jumps-jumps.wav"; $text = "Enemy $jumps jumps" }
            $path = Join-Path (Resolve-Path $dir) $name
            $voice.SetOutputToWaveFile($path, $format)
            $voice.Speak($text)
          }
          $voice.SetOutputToNull()
          $voice.Dispose()
          Get-ChildItem $dir | Format-Table Name, Length

      # Intel map layout: DOTLAN EveMaps' region maps (© Wollari), which are
      # never committed (PLAN.md Step 6). Cached per month; a new month
      # starts from last month's files and downloads them all again. Only
      # pushes to main save the cache, because GitHub doesn't share a PR's
      # cache with main or other PRs.
      - name: Dotlan cache key
        id: dotlan-key
        shell: pwsh
        run: |
          "key=dotlan-$((Get-Date).ToUniversalTime().ToString('yyyy-MM'))" >> $env:GITHUB_OUTPUT

      - name: Restore Dotlan maps
        id: dotlan-cache
        uses: actions/cache/restore@v4
        with:
          path: dotlan
          key: ${{ steps.dotlan-key.outputs.key }}
          restore-keys: dotlan-

      # Fetches the missing files (all of them, with -Refresh, when this
      # month's cache missed). A failed download keeps the cached copy and
      # never fails the build.
      - name: Download Dotlan maps
        shell: pwsh
        run: |
          if ("${{ steps.dotlan-cache.outputs.cache-hit }}" -eq "true") {
            ./xtask/dotlan.ps1 -Sde sde.zip -Folder dotlan
          } else {
            ./xtask/dotlan.ps1 -Sde sde.zip -Folder dotlan -Refresh
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $dir = "dist/Athena"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          cargo run --locked --package xtask -- sde sde.zip "$dir/static.sqlite" --dotlan dotlan
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target/release/athena.exe "$dir/Athena.exe"
          Copy-Item README.md "$dir/README.md"

      # Saved only after the build used the files, so a broken download
      # (which fails the build) is never cached.
      - name: Save Dotlan maps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dotlan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dotlan
          key: ${{ steps.dotlan-key.outputs.key }}

      # Uploads the folder itself: GitHub zips an artifact on download, so
      # uploading a ready-made zip would give a zip inside a zip. `dist` holds
      # only the Athena folder, so the download unpacks to `Athena\...`.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Athena-windows
          path: dist
          if-no-files-found: error

  # Publishes every push to main as a pre-release (creating its tag, such as
  # v0.1.1-alpha.6) and every hand-pushed v* tag as a normal release.
  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two quick merges publish one after the other, so the clean-up below
    # never races with a release that is still being made.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # download-artifact unpacks the folder again; zip it for the release.
      - uses: actions/download-artifact@v4
        with:
          name: Athena-windows
          path: dist

      - name: Zip the Athena folder
        run: cd dist && zip -r ../Athena-windows.zip Athena

      # The tag is made here, on the commit that was built. A tag pushed by
      # this workflow's own token doesn't start another CI run.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Athena v${{ env.VERSION }}
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: Athena-windows.zip
          generate_release_notes: true

      # Keeps the newest 10 automatic pre-releases (alpha tags, and their
      # git tags); older ones are deleted. Normal releases (v0.2.0) and
      # hand-made pre-releases (v0.2.0-beta.1) are never deleted. If several
      # PRs are merged within minutes, GitHub may skip publishing a middle
      # one; the next release still contains its changes.
      - name: Delete old pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
              --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease and (.tagName | test("-alpha\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting old pre-release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
