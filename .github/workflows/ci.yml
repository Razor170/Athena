# Checks every push and pull request, and builds the portable Windows zip.
# Pushing a version tag such as v0.1.0 also publishes the zip as a GitHub Release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Clippy (wgpu renderer)
        run: cargo clippy --locked --all-targets --features wgpu -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Release build
        run: cargo build --release --locked

      # Static game data (ore volumes, reprocessing, the map): built from the official
      # SDE by `cargo xtask sde` and shipped next to the exe. The ~100 MB SDE
      # zip is cached per SDE build, so it is only downloaded after a patch.
      # If CCP's site is down, the newest cached SDE is used instead.
      - name: Find latest SDE build
        id: sde
        shell: pwsh
        run: |
          # Saved to a file first: the site sends JSON Lines, which
          # Invoke-WebRequest hands back as bytes rather than text.
          $build = ""
          try {
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 60 -OutFile sde-latest.jsonl https://developers.eveonline.com/static-data/tranquility/latest.jsonl
            $build = "$((Get-Content -Raw sde-latest.jsonl | ConvertFrom-Json).buildNumber)"
          } catch {
            Write-Warning "Can't reach the SDE site: $_"
          }
          if ($build -notmatch '^\d+$') {
            Write-Warning "No SDE build number found, using the newest cached SDE."
            $build = "unavailable"
          }
          Write-Output "SDE build: $build"
          "build=$build" >> $env:GITHUB_OUTPUT

      - name: Cache SDE
        id: sde-cache
        uses: actions/cache@v4
        with:
          path: sde.zip
          key: sde-${{ steps.sde.outputs.build }}
          # No exact match: start from the newest SDE we have.
          restore-keys: sde-

      - name: Download SDE
        if: steps.sde-cache.outputs.cache-hit != 'true' && steps.sde.outputs.build != 'unavailable'
        shell: pwsh
        run: |
          $url = "https://developers.eveonline.com/static-data/tranquility/eve-online-static-data-${{ steps.sde.outputs.build }}-jsonl.zip"
          for ($try = 1; $try -le 3; $try++) {
            try {
              Invoke-WebRequest -UseBasicParsing -TimeoutSec 600 -OutFile sde.new.zip $url
              Move-Item -Force sde.new.zip sde.zip
              exit 0
            } catch {
              Write-Warning "SDE download attempt $try failed: $_"
              Start-Sleep -Seconds (15 * $try)
            }
          }
          if (Test-Path sde.zip) {
            Write-Warning "Using the older cached SDE instead."
          } else {
            Write-Error "No SDE available."
            exit 1
          }

      # Intel Supervisor voice alerts ("Enemy 3 jumps"), spoken by the
      # Windows built-in voice into 16-bit mono WAVs. Windows PowerShell 5.1
      # (`shell: powershell`) has System.Speech; PowerShell 7 doesn't.
      # The names must match `file_name` in src/modules/intel/sound.rs.
      - name: Make voice alert sounds
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Speech
          $dir = "dist/Athena/sounds"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          if ($voice.GetInstalledVoices().Count -eq 0) {
            Write-Error "No Windows voice is installed on this runner."
            exit 1
          }
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(22050, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          for ($jumps = 0; $jumps -le 10; $jumps++) {
            if ($jumps -eq 0) { $name = "enemy-in-system.wav"; $text = "Enemy in system" }
            elseif ($jumps -eq 1) { $name = "enemy-1-jump.wav"; $text = "Enemy 1 jump" }
            else { $name = "enemy-$jumps-jumps.wav"; $text = "Enemy $jumps jumps" }
            $path = Join-Path (Resolve-Path $dir) $name
            $voice.SetOutputToWaveFile($path, $format)
            $voice.Speak($text)
          }
          $voice.SetOutputToNull()
          $voice.Dispose()
          Get-ChildItem $dir | Format-Table Name, Length

      # Intel map layout: DOTLAN EveMaps' region maps (© Wollari), which are
      # never committed (PLAN.md Step 6). Cached per month; a new month
      # starts from last month's files and downloads them all again. Only
      # pushes to main save the cache, because GitHub doesn't share a PR's
      # cache with main or other PRs.
      - name: Dotlan cache key
        id: dotlan-key
        shell: pwsh
        run: |
          "key=dotlan-$((Get-Date).ToUniversalTime().ToString('yyyy-MM'))" >> $env:GITHUB_OUTPUT

      - name: Restore Dotlan maps
        id: dotlan-cache
        uses: actions/cache/restore@v4
        with:
          path: dotlan
          key: ${{ steps.dotlan-key.outputs.key }}
          restore-keys: dotlan-

      # Fetches the missing files (all of them, with -Refresh, when this
      # month's cache missed). A failed download keeps the cached copy and
      # never fails the build.
      - name: Download Dotlan maps
        shell: pwsh
        run: |
          if ("${{ steps.dotlan-cache.outputs.cache-hit }}" -eq "true") {
            ./xtask/dotlan.ps1 -Sde sde.zip -Folder dotlan
          } else {
            ./xtask/dotlan.ps1 -Sde sde.zip -Folder dotlan -Refresh
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $dir = "dist/Athena"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          cargo run --locked --package xtask -- sde sde.zip "$dir/static.sqlite" --dotlan dotlan
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target/release/athena.exe "$dir/Athena.exe"
          Copy-Item README.md "$dir/README.md"

      # Saved only after the build used the files, so a broken download
      # (which fails the build) is never cached.
      - name: Save Dotlan maps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dotlan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dotlan
          key: ${{ steps.dotlan-key.outputs.key }}

      # Uploads the folder itself: GitHub zips an artifact on download, so
      # uploading a ready-made zip would give a zip inside a zip. `dist` holds
      # only the Athena folder, so the download unpacks to `Athena\...`.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Athena-windows
          path: dist
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # download-artifact unpacks the folder again; zip it for the release.
      - uses: actions/download-artifact@v4
        with:
          name: Athena-windows
          path: dist

      - name: Zip the Athena folder
        run: cd dist && zip -r ../Athena-windows.zip Athena

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Athena-windows.zip
          generate_release_notes: true
