# Checks every push and pull request, and builds the portable Windows zip.
# Pushing a version tag such as v0.1.0 also publishes the zip as a GitHub Release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (wgpu renderer)
        run: cargo clippy --all-targets --features wgpu -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Package portable zip
        shell: pwsh
        run: |
          $dir = "dist/Athena"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/athena.exe "$dir/Athena.exe"
          Copy-Item README.md "$dir/README.md"
          Compress-Archive -Path "$dir" -DestinationPath dist/Athena-windows.zip -Force

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Athena-windows
          path: dist/Athena-windows.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Athena-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Athena-windows.zip
          generate_release_notes: true
